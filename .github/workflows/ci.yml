name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / stable Rust
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check repository links and example data
        run: python scripts/check-repository.py
      - name: Check C11 and C++17 native SDK layouts
        shell: pwsh
        run: |
          $nativeCompiler = (Get-Command clang -ErrorAction Stop).Source
          python scripts/check-native-abi.py --cc $nativeCompiler
      - name: Build native DLL and test ABI boundary
        shell: pwsh
        run: |
          cargo build --release --locked -p micopi-native-paint -p micopi-native-incompatible -p micopi-painting-tools -p micopi-ai-assistant -p micopi-compositing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/micopi_native_paint.dll plugins/native-paint/micopi_native_paint.dll
          Copy-Item target/release/micopi_painting_tools.dll plugins/painting/micopi_painting_tools.dll
          Copy-Item target/release/micopi_ai_assistant.dll plugins/ai-assistant/micopi_ai_assistant.dll
          Copy-Item target/release/micopi_compositing.dll plugins/compositing/micopi_compositing.dll
          $env:MICOPI_TEST_BAD_DLL = "$PWD/target/release/micopi_native_incompatible.dll"
          cargo test --locked native_plugin_dll_lifecycle -- --ignored
      - name: Test
        run: cargo test --locked
      - name: Test native SDK and pixel kernels
        run: cargo test --lib --locked -p micopi-plugin-api -p micopi-painting-tools -p micopi-compositing
      - name: Measure bounded native contact cost and coverage reuse
        run: cargo test --release --lib --locked -p micopi-painting-tools bounded_stroke_cost -- --ignored --nocapture --test-threads=1
      - name: Check native A8 and coverage ABI
        run: python scripts/smoke-native-masks.py
      - name: Build release
        run: cargo build --release --locked
      - name: Test headless core
        run: cargo test --no-default-features --locked
      - name: Verify JSONL and MCP produce identical pixels
        run: python scripts/smoke-runtime.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify non-raster adjustment stacks, masks and outcome replay
        run: python scripts/smoke-adjustments.py --cli target/release/micopi-cli.exe
      - name: Verify exact raster alignment, distribution and linked-mask outcomes
        run: python scripts/smoke-layer-arrangement.py --cli target/release/micopi-cli.exe
      - name: Verify published result revisions and historical reports
        run: python scripts/smoke-result-revisions.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify raster-mask storage, composition and outcome replay
        run: python scripts/smoke-raster-masks.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify public mask editing, effects and outcome replay
        run: python scripts/smoke-mask-editing.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify mask-aware document geometry and outcome replay
        run: python scripts/smoke-mask-geometry.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify linked owner movement, independent masks and compound outcomes
        run: python scripts/smoke-owner-movement.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify persistent layer links and explicit multi-owner movement
        run: python scripts/smoke-linked-movement.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify linked owner affine scopes, masks and atomic repeat outcomes
        run: python scripts/smoke-owner-affine.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify capped stroke opacity, independent Flow and outcome replay
        run: python scripts/smoke-stroke-opacity.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify single-layer mask ownership and outcome replay
        run: python scripts/smoke-mask-owners.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify mask-preserving group creation and hierarchy moves
        run: python scripts/smoke-mask-groups.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify mask-bearing group deletion and compound outcome replay
        run: python scripts/smoke-mask-group-delete.py --skip-gui --cli target/release/micopi-cli.exe
      - name: Verify mask-bearing subtree copies, identities and compound outcomes
        run: python scripts/smoke-mask-group-duplicate.py --skip-gui --cli target/release/micopi-cli.exe
