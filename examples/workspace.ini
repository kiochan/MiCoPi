# Copy beside MiCoPi.exe as MiCoPi.workspace.ini, then reload from the workspace menu.
# Panel widths: tools 224..360; layers 208..360.
tools_page=0
tools_width=260
layers_width=240
swapped=false
tools_visible=true
layers_visible=true
# Themes: 0 = mist white, 1 = warm paper, 2 = graphite.
theme=2
# Six-digit RGB, or auto for the theme's default.
accent=auto
# 0 = disabled, 1 = strongest; default 0.35.
stabilizer=0.35
pressure_size=true
pressure_opacity=false
# <1 responds more strongly to light pressure; >1 requires more pressure.
pressure_gamma=1
# Minimum radius fraction; valid pressure zero still deposits no paint.
pressure_minimum=0.08

# Independent panels: side, order, height weight, floating x/y/width/height.
dock_enabled=true
dock_left_width=260
dock_right_width=240
dock_color=left,0,350,80,80,240,350
dock_brush=left,1,450,120,120,260,450
dock_navigator=right,0,230,700,80,240,230
dock_layers=right,1,570,740,160,260,440

# Side names also accept top / bottom; their dock regions resize by height.
dock_top_height=200
dock_bottom_height=200
# Independent tabs by default. Panel indices: color=0, brush=1, navigator=2, layers=3.
dock_groups=0,1,2,3
dock_active=0,1,2,3
dock_tabs=0,1,2,3
